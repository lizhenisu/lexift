name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Validate tag and package version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = ((Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"$').Matches.Groups[1].Value)
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match workspace version $version"
          }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Lint M1 demo
        run: cargo clippy --workspace --all-targets --features m1-demo -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Test M1 demo
        run: cargo test --workspace --features m1-demo

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Configure signing certificate
        shell: pwsh
        env:
          SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
        run: |
          if ($env:SIGNING_CERTIFICATE) {
            $path = Join-Path $env:RUNNER_TEMP "lexift-signing.pfx"
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE))
            "LEXIFT_SIGN_CERT_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Build release artifacts
        shell: pwsh
        env:
          LEXIFT_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: ./scripts/package-release.ps1

      - name: Verify release executable
        shell: pwsh
        run: ./scripts/verify-release.ps1

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lexift-windows-${{ github.ref_name }}
          path: |
            dist/Lexift-*-windows-x86_64-setup.exe
            dist/Lexift-*-windows-x86_64-portable.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem dist/Lexift-*-windows-x86_64-setup.exe,
              dist/Lexift-*-windows-x86_64-portable.zip,
              dist/SHA256SUMS.txt
          )
          gh release create $env:GITHUB_REF_NAME @($assets.FullName) `
            --title "Lexift $env:GITHUB_REF_NAME" `
            --notes-file devdoc/release-notes-v0.1.0.md
