[package]
name = "lexift-app"
version.workspace = true
edition.workspace = true
description = "Lexift — Translate Everywhere"
license.workspace = true
build = "build.rs"

[[bin]]
name = "lexift"
path = "src/main.rs"

[package.metadata.winresource]
ProductName = "Lexift"
FileDescription = "Lexift — Translate Everywhere"
OriginalFilename = "lexift.exe"
LegalCopyright = "Copyright © 2026 Lexift contributors"

[features]
default = []
m1-demo = ["lexift-platform/mock", "lexift-translate/mock"]

[dependencies]
lexift-core.workspace = true
lexift-ui.workspace = true
lexift-platform.workspace = true
lexift-translate.workspace = true
lexift-config.workspace = true
lexift-observability.workspace = true
tracing.workspace = true
tokio.workspace = true

[dev-dependencies]
lexift-platform = { workspace = true, features = ["mock"] }
lexift-translate = { workspace = true, features = ["mock"] }

[build-dependencies]
winresource = "0.1.31"
