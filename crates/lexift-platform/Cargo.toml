[package]
name = "lexift-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
mock = []

[dependencies]
lexift-core.workspace = true
tracing.workspace = true
raw-window-handle = "0.6"

[build-dependencies]
resvg = { version = "0.48.1", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
# Shares the existing Slint backend version; taskbar policy must also update Winit state.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Media_Speech",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security_Credentials",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
